
name: Build Docker Image

on:
    push:
      paths-ignore:
        - 'docs/**'
    pull_request:
      branches:
        - master
      paths-ignore:
      - 'docs/**'
    # Allow manual running of this workflow.
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                # Test the next ubuntu-latest host without changing the container OS.
                os: [ubuntu-latest, ubuntu-26.04]

        env:
            # If we are in a tag use the tag name otherwise use latest
            # If the ref_name is master then use "latest"
            CONTAINER_TAG: ${{ github.ref_name == 'master' && 'latest' || github.ref_name }}
            # Only the primary runner publishes; the 26.04 canary always builds locally.
            SHOULD_PUSH: ${{ matrix.os == 'ubuntu-latest' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}

        steps:
        - name: Echo ref
          run: |
            echo "Tag name from GITHUB_REF_NAME: $GITHUB_REF_NAME"
            echo "Tag name from github.ref_name: ${{  github.ref_name }}"
            echo "Container tag: ${{ env.CONTAINER_TAG }}"
            echo "Should push: ${{ env.SHOULD_PUSH }}"

        - name: Checkout
          uses: actions/checkout@v4
          with:
            submodules: recursive

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          if: ${{ env.SHOULD_PUSH == 'true' }}
          uses: docker/login-action@v3
          with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build osgearth image
          uses: docker/build-push-action@v6
          with:
              context: .
              push: ${{ env.SHOULD_PUSH == 'true' }}
              cache-from: |
                pelicanmapping/osgearth:latest
                type=gha
              cache-to: ${{ env.SHOULD_PUSH == 'true' && 'type=gha,mode=max' || '' }}
              # PR refs and branch names can contain characters invalid in image tags.
              tags: ${{ env.SHOULD_PUSH == 'true' && format('pelicanmapping/osgearth:{0}', env.CONTAINER_TAG) || '' }}
