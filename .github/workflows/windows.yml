name: windows-x64-Release

on:
    push:
        branches: [master]
        tags: ['**']
    pull_request:
    workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

env:
  FEED_URL: https://nuget.pkg.github.com/gwaldron/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/gwaldron/index.json,readwrite"
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VCPKG_VERSION: '2026.07.29'
  CESIUM_NATIVE_PACKAGE: cesium-native-v0.37.0-vs2019
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_GHA_VERSION: osgearth-windows-v1

jobs:

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ['windows-latest']
        include:
          - os: 'windows-latest'
            triplet: 'x64-windows-release'
            mono: ''
            VCPKG_WORKSPACE: 'c:/vcpkg_own'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Installing vcpkg (windows)
      shell: 'bash'
      run: |
        cmake -E make_directory ${{ matrix.VCPKG_WORKSPACE }}
        cd ${{ matrix.VCPKG_WORKSPACE }}
        # git clone --depth 1 --branch ${{env.VCPKG_VERSION}} https://github.com/microsoft/vcpkg
        git clone https://github.com/microsoft/vcpkg
        cd vcpkg
        git checkout ${{env.VCPKG_VERSION}}
        cd ..
        # Use Savannah's HTTPS endpoint; keep the tagged libgta archive and checksum.
        sed -i 's|http://download.savannah.nongnu.org|https://download.savannah.nongnu.org|' \
          ./vcpkg/ports/libgta/portfile.cmake
        ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
        ${{ matrix.VCPKG_WORKSPACE }}/vcpkg/vcpkg version

    - name: Add NuGet sources
      shell: pwsh
      run: |
        .$(${{ matrix.VCPKG_WORKSPACE }}/vcpkg/vcpkg fetch nuget) `
          sources add `
          -Source "${{ env.FEED_URL }}" `
          -StorePasswordInClearText `
          -Name GitHubPackages `
          -UserName "gwaldron" `
          -Password "${{ secrets.NUGET_CACHE_TOKEN }}"
        .$(${{ matrix.VCPKG_WORKSPACE }}/vcpkg/vcpkg fetch nuget) `
          setapikey "${{ secrets.NUGET_CACHE_TOKEN }}" `
          -Source "${{ env.FEED_URL }}"

    - name: Create Build Environment
      shell: pwsh
      run: |
        $buildDirectory = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) build
        New-Item -ItemType Directory -Force -Path $buildDirectory | Out-Null
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "OSGEARTH_CI_BUILD_DIR=$buildDirectory"

    - name: Cache cesium-native
      id: cesium-cache
      uses: actions/cache@v6
      with:
        path: C:/cesium-native
        # No restore prefix: the libraries must match the requested package exactly.
        key: ${{ runner.os }}-${{ runner.arch }}-${{ env.CESIUM_NATIVE_PACKAGE }}-v1

    - name: Download cesium-native
      if: steps.cesium-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "$env:CESIUM_NATIVE_PACKAGE.zip"
        $url = "https://pelican-public.s3.us-east-1.amazonaws.com/$env:CESIUM_NATIVE_PACKAGE.zip"
        Invoke-WebRequest -Uri $url -OutFile $archive
        Expand-Archive -LiteralPath $archive -DestinationPath C:/cesium-native

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.19.0

    - name: Configure CMake
      shell: pwsh
      working-directory: ${{ env.OSGEARTH_CI_BUILD_DIR }}
      # Ninja supports compiler launchers; keep MSVC and the existing Release build options.
      run: |
        cmake "$env:GITHUB_WORKSPACE" -G Ninja `
          "-DCMAKE_C_COMPILER=cl.exe" "-DCMAKE_CXX_COMPILER=cl.exe" `
          "-DCMAKE_C_COMPILER_LAUNCHER=sccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache" `
          "-DOSGEARTH_BUILD_LEGACY_SPLAT_NODEKIT=OFF" "-DOSGEARTH_BUILD_PROCEDURAL_NODEKIT=ON" `
          "-DOSGEARTH_BUILD_CESIUM_NODEKIT=ON" "-DOSGEARTH_ENABLE_S3=ON" `
          "-DCESIUM_NATIVE_DIR=C:/cesium-native" "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE" `
          "-DCMAKE_TOOLCHAIN_FILE=${{ matrix.VCPKG_WORKSPACE }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          "-DVCPKG_MANIFEST_DIR=$env:GITHUB_WORKSPACE" "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"

    - name: 'Upload cmake configure log artifact'
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: cmake-log
        path: |
          ${{ env.OSGEARTH_CI_BUILD_DIR }}/CMakeCache.txt
        retention-days: 1

    - name: Build
      working-directory: ${{ env.OSGEARTH_CI_BUILD_DIR }}
      shell: pwsh
      run: |
        sccache --zero-stats
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build . --config $env:BUILD_TYPE --parallel $env:NUMBER_OF_PROCESSORS
